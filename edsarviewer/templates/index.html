<!DOCTYPE html>
<html>
    <head>
        <title>HOMEPAGE</title>
    </head>

    <body>
        <form method="POST" action="{% url 'edsarview' %}">
            {% csrf_token %}
            <button type="submit">CONVERT</button>
        </form>

        {% if output %} 
            <h2>Output:</h2>
            <pre>{{ output }}</pre>
        {% endif %}

        {% if error %} 
            <h2 style="color:red">Error:</h2>
            <pre>{{ error }}</pre>
        {% endif %}
    </body>
</html>
